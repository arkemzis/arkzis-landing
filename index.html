<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKZIS — Connect without limits</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: #09090B;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }
  .glow {
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(circle, rgba(124,58,237,0.35) 0%, transparent 60%);
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  .container { position: relative; z-index: 1; text-align: center; max-width: 480px; }
  .logo {
    font-size: 64px;
    font-weight: 800;
    background: linear-gradient(135deg, #A855F7, #7C3AED, #5B21B6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -2px;
    margin-bottom: 8px;
  }
  .slogan {
    font-size: 16px;
    color: #A855F7;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 48px;
    font-weight: 600;
  }
  .btn {
    display: inline-block;
    padding: 18px 48px;
    background: linear-gradient(135deg, #7C3AED, #A855F7);
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 700;
    font-size: 17px;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 8px 32px rgba(124,58,237,0.4);
    margin-bottom: 20px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(124,58,237,0.6);
  }
  .version { font-size: 13px; color: #71717A; margin-top: 8px; }
  .features {
    margin-top: 64px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    font-size: 14px;
    color: #A1A1AA;
  }
  .features span {
    padding: 10px 16px;
    background: rgba(124,58,237,0.1);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 12px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <div class="logo">ARKZIS</div>
    <div class="slogan">Connect without limits</div>
    <a href="https://github.com/arkemzis/arkzis/releases/latest" class="btn" target="_blank">📱 Скачать для Android</a>
    <div class="version">Бета · 10.10.2026</div>
    <div class="features">
      <span>🔒 E2E шифрование</span>
      <span>💬 Личные чаты</span>
      <span>👥 Группы</span>
      <span>📸 Сторис 24ч</span>
    </div>
  </div>
</body>
</html>
